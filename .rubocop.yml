require:
  - rubocop-rspec
  - rubocop-rake

AllCops:
  TargetRubyVersion: 3.2
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - "vendor/**/*"
    - "tmp/**/*"

Style/Documentation:
  Enabled: false

Style/FrozenStringLiteralComment:
  Enabled: true
  EnforcedStyle: always

Layout/LineLength:
  Max: 120

Metrics/MethodLength:
  Max: 25

Metrics/ClassLength:
  Max: 300

Metrics/ModuleLength:
  Max: 300

Metrics/BlockLength:
  Exclude:
    - "spec/**/*"
    - "*.gemspec"
    - "Rakefile"

Metrics/AbcSize:
  Max: 30

Naming/MethodParameterName:
  AllowedNames:
    - id
    - ns
    - db
    - to

RSpec/SpecFilePathFormat:
  Enabled: false

RSpec/DescribeClass:
  Exclude:
    - "spec/integration/**/*"
    - "spec/unit/connections/embedded_spec.rb"

RSpec/MultipleDescribes:
  Enabled: false

RSpec/MultipleExpectations:
  Max: 7

RSpec/ExampleLength:
  Max: 20

RSpec/NestedGroups:
  Max: 4
